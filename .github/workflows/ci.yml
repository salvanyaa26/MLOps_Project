name: CI Pipeline - Build Docker Image

# 1. When should this robot wake up?
on:
  push:
    branches: [ "main" ]

# 2. What should the robot do?
jobs:
  build-and-test:
    # GitHub gives us a free Linux server for a few minutes!
    runs-on: ubuntu-latest

    steps:
    # Step A: Downloads code from the cd repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step B: Set up Docker on the GitHub server
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step C: Run the exact command you ran earlier!
    - name: Build Docker Image
      run: docker build -t sentiment-api:test .